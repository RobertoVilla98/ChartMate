name: Release

# Builds native installers for Windows, macOS and Linux and attaches them to a draft GitHub Release.
# Trigger: push a version tag (e.g. `git tag v0.3.0 && git push origin v0.3.0`) or run manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 (.msi / .exe)
            os: windows-latest
            args: ''
          - label: macOS Universal (.dmg / .app)
            os: macos-latest
            args: '--target universal-apple-darwin'
          - label: Linux x64 (.AppImage / .deb / .rpm)
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'ChartMate ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Manual runs have no tag/release: keep the installers as workflow artifacts instead
      - name: Upload installers as workflow artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: chartmate-${{ runner.os }}
          path: tauri-app/src-tauri/target/**/release/bundle/**
          if-no-files-found: error
