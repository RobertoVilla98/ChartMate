[package]
name = "chartmate-io"
version = "0.3.0"
description = "ChartMate I/O engine: pure-Rust readers for tabular and scientific formats and time-series re-sampling"
authors = ["Roberto Villa"]
license = "MIT"
repository = "https://github.com/RobertoVilla98/ChartMate"
edition = "2021"
rust-version = "1.81"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ryu = "1"
sha2 = "0.10"
calamine = "0.30.1"
csv = "1.4.0"
parquet = { version = "53", default-features = false, features = ["snap", "flate2", "lz4", "brotli", "arrow"] }
arrow-array = "53"
arrow-schema = "53"
arrow-cast = "53"
hdf5-reader = "0.12.1"
netcdf-reader = "0.12.1"
matfile = "0.5.0"
sas7bdat = "0.9.3"
