[workspace]
members = [".", "chartmate-io"]

[package]
name = "app"
version = "0.3.0"
description = "ChartMate - scientific visualization and building physics studio"
authors = ["Roberto Villa"]
license = "MIT"
repository = "https://github.com/RobertoVilla98/ChartMate"
edition = "2021"
rust-version = "1.81"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
chartmate-io = { path = "chartmate-io" }
mysql = { version = "25", default-features = false, features = ["minimal", "rustls-tls"] }

